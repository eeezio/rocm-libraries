name: TheRock CI Linux Coverage

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      project_name:
        type: string
      cmake_target:
        type: string
      build_dir:
        type: string
      coverage_config:
        description: "Per-project coverage metadata file (test_categories_coverage.yaml)."
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      projects_to_test:
        type: string
      test_type:
        type: string
      therock_ref:
        type: string
        default: enable-codecov
      test_therock_ref:
        type: string
        default: enable-codecov

permissions:
  contents: read

jobs:
  therock-coverage-build:
    name: Build Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    runs-on: aws-linux-scale-rocm-prod
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2
      options: -v /runner/config:/home/awsconfig/
    env:
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: "Checking out repository for rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "reboss/TheRock"
          path: TheRock
          ref: ${{ inputs.therock_ref }}

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks ${{ contains(inputs.cmake_options, 'THEROCK_ENABLE_IREE_LIBS=ON') && '--include-iree-libs' || '' }}

      - name: Enable coverage instrumentation for sub-project
        run: |
          # TheRock does not reliably forward -D<PROJECT>_ENABLE_COVERAGE to the
          # sub-project (ROCm/TheRock#6572). Environment variables DO propagate through
          # TheRock's sub-project sandbox (only ROCM_PATH/ROCM_DIR/HIP_PATH/HIP_DIR are
          # unset), so export it for the configure + build steps; the component CMake
          # honors $ENV{<PROJECT>_ENABLE_COVERAGE} as a fallback trigger.
          echo "${{ inputs.project_name }}_ENABLE_COVERAGE=ON" >> "$GITHUB_ENV"

      - name: Configure coverage build
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          extra_cmake_options: >-
            -DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../
            -D${{ inputs.project_name }}_ENABLE_COVERAGE=ON
            -DLLVM_TOOLS_SEARCH_PREFIX=${{ github.workspace }}/TheRock/build-coverage/dist/rocm/lib/llvm
            -DCOMPILER_RT_BUILD_PROFILE_ROCM=ON
            -DLLVM_PARALLEL_LINK_JOBS=4
            -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF
            ${{ inputs.cmake_options }}
          BUILD_DIR: build-coverage
        run: |
          # Override PROFILE_DIR with the container workspace path so the coverage
          # profraw path baked into the tests is valid on the test node too
          # (build and test containers share ${GITHUB_WORKSPACE}=/__w/...).
          export extra_cmake_options="${extra_cmake_options} -DPROFILE_DIR=${GITHUB_WORKSPACE}/coverage-report"
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-artifacts and therock-dist
        run: cmake --build TheRock/build-coverage --target therock-artifacts therock-dist -- -k 0

      - name: Debug dist directory before artifact push
        if: ${{ !cancelled() }}
        run: |
          set +e  # diagnostic only
          echo "=========================================="
          echo "=== DIST DIRECTORY DEBUG START ==="
          echo "=========================================="
          echo "dist/rocm structure:"
          ls -lh TheRock/build-coverage/dist/rocm/ 2>/dev/null | head -30
          echo ""
          echo "dist/rocm/lib structure:"
          ls -lh TheRock/build-coverage/dist/rocm/lib/ 2>/dev/null | head -30
          echo ""
          echo "dist/rocm/lib/llvm structure:"
          ls -lhR TheRock/build-coverage/dist/rocm/lib/llvm/ 2>/dev/null | head -80 || echo "(llvm dir not found in dist)"
          echo ""
          echo "Searching for llvm-profdata in dist/:"
          find TheRock/build-coverage/dist -type f -name llvm-profdata 2>/dev/null || echo "(not found)"
          echo ""
          echo "Searching for libclang_rt.profile* in dist/:"
          find TheRock/build-coverage/dist -name "libclang_rt.profile*" 2>/dev/null | head -10 || echo "(not found)"
          echo ""
          echo "=========================================="
          echo "=== DIST DIRECTORY DEBUG END ==="
          echo "=========================================="

      - name: Verify coverage instrumentation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e  # diagnostic only; never fail the build
          proj="$(echo '${{ inputs.project_name }}' | tr '[:upper:]' '[:lower:]')"
          BC=TheRock/build-coverage
          nm="$(find "$BC" -type f -name llvm-nm -path '*/llvm/bin/*' 2>/dev/null | head -1)"
          echo "===== coverage self-check (${proj}) ====="
          echo "-- [1] lib${proj}.so* symbol counts (symlinks resolved) --"
          find "$BC" -name "lib${proj}.so*" 2>/dev/null | sort -u | while read -r so; do
            real="$(readlink -f "$so" 2>/dev/null || echo "$so")"
            printf '    %6s __llvm_profile  %s\n' "$("${nm}" "$real" 2>/dev/null | grep -c __llvm_profile)" "$so"
          done
          echo "-- [2] compile_commands*.json entries with -fprofile-instr-generate --"
          find "$BC" -name "compile_commands*.json" 2>/dev/null | while read -r cc; do
            n="$(grep -c "fprofile-instr-generate" "$cc" 2>/dev/null)"
            printf '    %6s  %s\n' "${n:-0}" "$cc"
          done
          echo "-- [3] ${proj} configure log: coverage/ENABLE/fprofile lines --"
          find "$BC" -iname "*${proj}*configure*.log" 2>/dev/null | while read -r lg; do
            echo "    log: $lg"
            grep -iE "coverage|ENABLE_COVERAGE|fprofile" "$lg" 2>/dev/null | head -8 | sed 's/^/       /'
          done
          echo "===== end self-check ====="

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          set +e  # best-effort diagnostics; never fail the build on reporting
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build-coverage/dist/rocm
          echo "Artifact Archives:"
          echo "------------------"
          ls -lh TheRock/build-coverage/artifacts/ 2>/dev/null
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build-coverage/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Debug artifacts before push
        if: ${{ !cancelled() }}
        run: |
          set +e  # diagnostic only; never fail
          proj="$(echo '${{ inputs.project_name }}' | tr '[:upper:]' '[:lower:]')"
          BC=TheRock/build-coverage
          nm="$(find "$BC" -type f -name llvm-nm -path '*/llvm/bin/*' 2>/dev/null | head -1)"

          echo "=========================================="
          echo "=== PRE-UPLOAD ARTIFACT DEBUG START ==="
          echo "=========================================="

          # 1. Verify instrumentation in artifacts directory
          echo ""
          echo "--- [1] Artifacts Directory Structure ---"
          if [[ -d "$BC/artifacts" ]]; then
            echo "Listing all tarballs in artifacts/:"
            ls -lh "$BC/artifacts/" | grep -E "\.tar\.|\.zip" || echo "(no archives found)"

            echo ""
            echo "Examining archives containing '${proj}':"
            find "$BC/artifacts" -type f \( -name "*${proj}*.tar.*" -o -name "*${proj}*.zip" \) 2>/dev/null | while read -r archive; do
              echo "  Archive: $archive"
              echo "    Size: $(stat -c%s "$archive" 2>/dev/null || echo "?")"
              echo "    Contents preview:"
              if [[ "$archive" == *.tar.gz ]]; then
                tar -tzf "$archive" 2>/dev/null | head -20 | sed 's/^/      /'
              elif [[ "$archive" == *.tar.bz2 ]]; then
                tar -tjf "$archive" 2>/dev/null | head -20 | sed 's/^/      /'
              elif [[ "$archive" == *.tar.xz ]]; then
                tar -tJf "$archive" 2>/dev/null | head -20 | sed 's/^/      /'
              elif [[ "$archive" == *.zip ]]; then
                unzip -l "$archive" 2>/dev/null | head -25 | sed 's/^/      /'
              fi
            done
          else
            echo "(artifacts directory $BC/artifacts does not exist)"
          fi

          # 2. Check if lib${proj}.so is in dist/ and if it's instrumented
          echo ""
          echo "--- [2] Dist Directory Instrumented Library Check ---"
          if [[ -d "$BC/dist" ]]; then
            echo "Searching for lib${proj}.so* in dist/:"
            find "$BC/dist" -name "lib${proj}.so*" 2>/dev/null | while read -r so; do
              real="$(readlink -f "$so" 2>/dev/null || echo "$so")"
              if [[ -n "$nm" ]]; then
                count="$("${nm}" "$real" 2>/dev/null | grep -c __llvm_profile || echo "0")"
                echo "  ${count} __llvm_profile symbols: $so"
              else
                echo "  Found: $so (no llvm-nm to check symbols)"
              fi
            done
          else
            echo "(dist directory $BC/dist does not exist)"
          fi

          # 3. Check what artifact_manager.py will actually push
          echo ""
          echo "--- [3] Artifact Manager Dry-Run Preview ---"
          echo "Running artifact_manager.py in list mode to see what would be pushed..."
          python TheRock/build_tools/artifact_manager.py list \
            --build-dir TheRock/build-coverage 2>&1 | head -50 || echo "(artifact_manager.py list failed)"

          # 4. Check BUILD_TOPOLOGY.toml artifact definitions
          echo ""
          echo "--- [4] BUILD_TOPOLOGY.toml Relevant Entries ---"
          if [[ -f "TheRock/BUILD_TOPOLOGY.toml" ]]; then
            echo "Searching for '${proj}' artifact definitions:"
            grep -A10 -B2 "\\[${proj}\\]" TheRock/BUILD_TOPOLOGY.toml 2>/dev/null || echo "(no [${proj}] section found)"
            echo ""
            echo "Searching for 'rand' artifact definitions (broader search):"
            grep -A10 -B2 "rand" TheRock/BUILD_TOPOLOGY.toml 2>/dev/null | head -40 || echo "(no rand mentions found)"
          else
            echo "(BUILD_TOPOLOGY.toml not found)"
          fi

          # 5. Final confirmation of instrumented library existence
          echo ""
          echo "--- [5] Final Library Instrumentation Confirmation ---"
          if [[ -n "$nm" ]]; then
            echo "All lib${proj}.so* files in build tree with symbol counts:"
            find "$BC" -name "lib${proj}.so*" -type f 2>/dev/null | while read -r so; do
              real="$(readlink -f "$so" 2>/dev/null || echo "$so")"
              count="$("${nm}" "$real" 2>/dev/null | grep -c __llvm_profile || echo "0")"
              size="$(stat -c%s "$real" 2>/dev/null || echo "?")"
              printf "  %6s symbols | %10s bytes | %s\n" "$count" "$size" "$so"
            done
          fi

          echo ""
          echo "========================================"
          echo "=== PRE-UPLOAD ARTIFACT DEBUG END ==="
          echo "========================================"

      - name: List artifacts before push
        if: ${{ !cancelled() }}
        run: |
          echo "=== Artifacts in build-coverage/artifacts/ ==="
          ls -lh TheRock/build-coverage/artifacts/ 2>/dev/null || echo "(no artifacts dir)"
          echo ""
          echo "=== Artifact directories (first 30) ==="
          find TheRock/build-coverage/artifacts/ -maxdepth 1 -type d 2>/dev/null | head -30 || echo "(none)"
          echo ""
          echo "=== Checking for amd-llvm artifacts ==="
          find TheRock/build-coverage/artifacts/ -name "*amd-llvm*" 2>/dev/null || echo "(no amd-llvm artifacts found)"
          echo ""
          echo "=== amd-llvm artifact structure and llvm-profdata location ==="
          echo "Contents of amd-llvm_lib_generic (first 30 files):"
          find TheRock/build-coverage/artifacts/amd-llvm_lib_generic -type f 2>/dev/null | head -30 || echo "(artifact not found or empty)"
          echo ""
          echo "Contents of amd-llvm_run_generic (first 30 files):"
          find TheRock/build-coverage/artifacts/amd-llvm_run_generic -type f 2>/dev/null | head -30 || echo "(artifact not found or empty)"
          echo ""
          echo "Searching for llvm-profdata in ALL amd-llvm artifacts:"
          LLVM_PROFDATA="$(find TheRock/build-coverage/artifacts/amd-llvm* -type f -name llvm-profdata 2>/dev/null | head -1)"
          if [[ -n "$LLVM_PROFDATA" ]]; then
            echo "Found llvm-profdata at: $LLVM_PROFDATA"
            "$LLVM_PROFDATA" merge 2>&1 | head -5
          else
            echo "(llvm-profdata not found in any amd-llvm artifact)"
          fi
          echo ""
          echo "Searching for llvm-profdata in build-coverage/dist:"
          LLVM_PROFDATA_DIST="$(find TheRock/build-coverage/dist -type f -name llvm-profdata 2>/dev/null | head -1)"
          if [[ -n "$LLVM_PROFDATA_DIST" ]]; then
            echo "Found llvm-profdata at: $LLVM_PROFDATA_DIST"
            "$LLVM_PROFDATA_DIST" merge 2>&1 | head -5
          else
            echo "(llvm-profdata not found in dist)"
          fi
          echo ""
          echo "Checking for libclang_rt.profile.a in amd-llvm artifacts:"
          find TheRock/build-coverage/artifacts/amd-llvm* -name "libclang_rt.profile.a" 2>/dev/null || echo "(not found in artifacts)"

      - name: Push artifacts
        run: |
          set -x  # Show all commands being run
          echo "=========================================="
          echo "=== ARTIFACT PUSH DEBUG START ==="
          echo "=========================================="
          echo "Run ID: ${{ github.run_id }}"
          echo "Build dir: TheRock/build-coverage"
          echo "Artifacts directory contents:"
          ls -lh TheRock/build-coverage/artifacts/ 2>/dev/null | head -50
          echo ""
          echo "Running artifact_manager.py push with verbose output:"
          python TheRock/build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --build-dir TheRock/build-coverage \
            --stage all 2>&1 | tee /tmp/artifact_push.log
          echo ""
          echo "Artifact push completed. Summary from log:"
          grep -iE "pushing|uploaded|artifact|error|warning" /tmp/artifact_push.log | tail -30 || echo "(no summary found)"
          echo "=========================================="
          echo "=== ARTIFACT PUSH DEBUG END ==="
          echo "=========================================="
          set +x

      - name: Post Build Upload
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build-coverage \
            --upload

  therock-coverage-test:
    name: Test Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    needs: [therock-coverage-build]
    if: ${{ inputs.test_runs_on != 'gfx950-dcgpu' }}
    uses: ./.github/workflows/therock-test-packages.yml
    secrets: inherit
    with:
      therock_ref: ${{ inputs.test_therock_ref }}
      projects_to_test: ${{ inputs.projects_to_test }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      test_type: ${{ inputs.test_type }}
      coverage_enabled: true
