name: Test component

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      therock_ref:
        type: string
        required: true
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string
      coverage_enabled:
        description: "When true, collect llvm profraw from the test run and generate a coverage report."
        type: boolean
        default: false


permissions:
  contents: read

jobs:
  test_component:
    name: 'Test ${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }} of ${{ fromJSON(inputs.component).total_shards }})'
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 210
    container:
      image: ${{ inputs.platform == 'linux' && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    strategy:
      fail-fast: false
      matrix:
        # The shard array is based on "total_shards" from "fetch_test_configurations.py"
        # The test executable will shard based on the array. (ex: [1, 2, 3, 4] = four test shards)
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
      TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "reboss/TheRock"
          ref: ${{ inputs.therock_ref }}
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Pre-job cleanup GPU processes on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "reboss/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Configure git for long paths on Windows
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      # Set thread limits from KUBE_CPU_REQUEST (Kubernetes-injected) to avoid oversubscription.
      # Must be done at runtime since container env vars aren't in GitHub's env context.
      - name: Set thread limits
        run: |
          if [[ -n "${KUBE_CPU_REQUEST:-}" ]]; then
            CPU_COUNT="${KUBE_CPU_REQUEST%.*}"
            echo "OPENBLAS_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "OMP_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "Thread limits set: OPENBLAS_NUM_THREADS=${CPU_COUNT}, OMP_NUM_THREADS=${CPU_COUNT} (from KUBE_CPU_REQUEST=${KUBE_CPU_REQUEST})"
          else
            echo "KUBE_CPU_REQUEST not set, thread limits not configured"
          fi

      - name: Prepare coverage profile directory
        if: ${{ inputs.coverage_enabled }}
        run: |
          # Raw profiles are collected under ${PROFILE_DIR}/profraw. The coverage build
          # overrides PROFILE_DIR to ${GITHUB_WORKSPACE}/coverage-report (a container path
          # valid on this test node), so profraw lands in coverage-report/profraw.
          # This GITHUB_ENV value is the fallback for binaries whose ctest ENVIRONMENT
          # does not already bake LLVM_PROFILE_FILE; hipRAND overrides it per-test to the
          # same dir. Non-instrumented binaries ignore it.
          mkdir -p "${GITHUB_WORKSPACE}/coverage-report/profraw"
          echo "LLVM_PROFILE_FILE=${GITHUB_WORKSPACE}/coverage-report/profraw/${TEST_COMPONENT}-shard${{ matrix.shard }}-%p-%m.profraw" >> "${GITHUB_ENV}"

      - name: Debug coverage instrumentation setup
        if: ${{ inputs.coverage_enabled }}
        run: |
          set +e  # diagnostic only; never fail
          echo "=============================================="
          echo "=== COVERAGE INSTRUMENTATION DEBUG START ==="
          echo "=============================================="

          # 1. Environment variables
          echo ""
          echo "--- [1] Environment Variables ---"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "TEST_COMPONENT=${TEST_COMPONENT}"
          echo "LLVM_PROFILE_FILE=${LLVM_PROFILE_FILE}"
          env | grep -i profile || echo "(no PROFILE env vars set)"

          # 2. Directory structure and permissions
          echo ""
          echo "--- [2] Coverage Directory Structure ---"
          ls -la "${GITHUB_WORKSPACE}/coverage-report/" 2>/dev/null || echo "(coverage-report dir missing)"
          ls -la "${GITHUB_WORKSPACE}/coverage-report/profraw/" 2>/dev/null || echo "(profraw subdir missing)"
          echo "Directory ownership and permissions:"
          stat "${GITHUB_WORKSPACE}/coverage-report/profraw/" 2>/dev/null || echo "(cannot stat profraw dir)"
          echo "Checking write permissions:"
          touch "${GITHUB_WORKSPACE}/coverage-report/profraw/test-write-$$" && rm -f "${GITHUB_WORKSPACE}/coverage-report/profraw/test-write-$$" && echo "✓ profraw dir is writable" || echo "✗ profraw dir is NOT writable"

          # 3. Binary instrumentation check - library
          echo ""
          echo "--- [3] Library Instrumentation Check ---"
          LLVM_NM="$(find ./build -type f -name llvm-nm -path '*/llvm/bin/*' 2>/dev/null | head -1)"
          if [[ -n "${LLVM_NM}" ]]; then
            echo "Using llvm-nm: ${LLVM_NM}"
            echo "Searching for lib${TEST_COMPONENT}.so* files..."
            find ./build -name "lib${TEST_COMPONENT}.so*" 2>/dev/null | while read -r so; do
              real="$(readlink -f "$so" 2>/dev/null || echo "$so")"
              count="$("${LLVM_NM}" "$real" 2>/dev/null | grep -c "__llvm_profile" || echo "0")"
              echo "  ${count} __llvm_profile symbols in: $so -> $real"
              if [[ "$count" -gt 0 ]]; then
                echo "  Sample symbols:"
                "${LLVM_NM}" "$real" 2>/dev/null | grep "__llvm_profile" | head -5 | sed 's/^/    /'
              fi
            done
          else
            echo "(llvm-nm not found, skipping symbol check)"
          fi

          # 4. Binary instrumentation check - test executables
          echo ""
          echo "--- [4] Test Executable Instrumentation Check ---"
          TEST_DIR="./build/bin/${TEST_COMPONENT}"
          if [[ -d "${TEST_DIR}" ]]; then
            echo "Test directory: ${TEST_DIR}"
            ls -lh "${TEST_DIR}/" | head -10
            if [[ -n "${LLVM_NM}" ]]; then
              echo "Checking first 3 test executables for __llvm_profile symbols..."
              find "${TEST_DIR}" -maxdepth 1 -type f -executable 2>/dev/null | head -3 | while read -r exe; do
                count="$("${LLVM_NM}" "$exe" 2>/dev/null | grep -c "__llvm_profile" || echo "0")"
                echo "  ${count} __llvm_profile symbols in: $(basename "$exe")"
              done
            fi
          else
            echo "(test directory ${TEST_DIR} not found)"
          fi

          # 5. Library linkage verification
          echo ""
          echo "--- [5] Library Linkage Verification ---"
          if [[ -d "${TEST_DIR}" ]]; then
            find "${TEST_DIR}" -maxdepth 1 -type f -executable 2>/dev/null | head -3 | while read -r exe; do
              echo "ldd for $(basename "$exe"):"
              ldd "$exe" 2>/dev/null | grep -iE "hip|${TEST_COMPONENT}" | sed 's/^/  /' || echo "  (no matching libs in ldd output)"
            done
          fi

          # 6. CTestTestfile.cmake inspection
          echo ""
          echo "--- [6] CTestTestfile.cmake LLVM_PROFILE_FILE Settings ---"
          CTEST_FILE="${TEST_DIR}/CTestTestfile.cmake"
          if [[ -f "${CTEST_FILE}" ]]; then
            echo "Examining: ${CTEST_FILE}"
            grep -n "LLVM_PROFILE_FILE" "${CTEST_FILE}" || echo "(no LLVM_PROFILE_FILE settings found)"
            echo "Full ENVIRONMENT properties:"
            grep -A2 "set_tests_properties.*ENVIRONMENT" "${CTEST_FILE}" | head -20 || echo "(no ENVIRONMENT properties found)"
          else
            echo "(CTestTestfile.cmake not found at ${CTEST_FILE})"
          fi

          # 7. Compiler-RT profile library check
          echo ""
          echo "--- [7] Compiler-RT Profile Library Check ---"
          echo "Searching for libclang_rt.profile*..."
          find ./build -name "libclang_rt.profile*" 2>/dev/null | while read -r lib; do
            echo "  Found: $lib"
            file "$lib" 2>/dev/null | sed 's/^/    /'
          done || echo "(no libclang_rt.profile* files found)"

          echo ""
          echo "--- [7b] llvm-profdata Version Check ---"
          LLVM_PROFDATA="$(find ./build -type f -name llvm-profdata -path '*/llvm/bin/*' 2>/dev/null | head -1)"
          if [[ -n "$LLVM_PROFDATA" ]]; then
            echo "Found llvm-profdata at: $LLVM_PROFDATA"
            echo "Version output:"
            "$LLVM_PROFDATA" merge 2>&1 | head -5
            echo "Checking __llvm_profile_raw_version in libclang_rt.profile.a:"
            PROFILE_RT="$(find ./build -name "libclang_rt.profile.a" -path "*/x86_64-unknown-linux-gnu/*" 2>/dev/null | head -1)"
            if [[ -n "$PROFILE_RT" ]]; then
              echo "Found: $PROFILE_RT"
              nm "$PROFILE_RT" 2>/dev/null | grep __llvm_profile_raw_version || echo "(no version symbol found)"
            fi
          else
            echo "(llvm-profdata not found)"
          fi

          # 8. Pre-existing profraw files check
          echo ""
          echo "--- [8] Pre-existing .profraw Files ---"
          echo "Searching entire workspace for .profraw files (before test run)..."
          find "${GITHUB_WORKSPACE}" -name "*.profraw" 2>/dev/null | head -20 || echo "(no .profraw files found yet)"

          # 9. Build artifacts structure
          echo ""
          echo "--- [9] Build Artifacts Structure ---"
          echo "Top-level build/ structure:"
          ls -lh ./build/ 2>/dev/null | head -20 || echo "(build dir missing)"
          echo "build/lib/ contents:"
          ls -lh ./build/lib/ 2>/dev/null | head -20 || echo "(build/lib missing)"

          # 10. Coverage metadata check
          echo ""
          echo "--- [10] Coverage Configuration Files ---"
          CFG_FILE="$(find "rocm-libraries/projects/${TEST_COMPONENT}" -name test_categories_coverage.yaml 2>/dev/null | head -1)"
          if [[ -n "${CFG_FILE}" ]]; then
            echo "Found coverage config: ${CFG_FILE}"
            head -20 "${CFG_FILE}" | sed 's/^/  /'
          else
            echo "(no test_categories_coverage.yaml found for ${TEST_COMPONENT})"
          fi

          echo ""
          echo "============================================"
          echo "=== COVERAGE INSTRUMENTATION DEBUG END ==="
          echo "============================================"

      - name: Test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
        run: |
          # Create logs directory
          mkdir -p ./test_logs

          if [[ "${{ inputs.coverage_enabled }}" == "true" ]]; then
            # reboss suggestion: run the tests via coverage_runner.py (it sets
            # LLVM_PROFILE_FILE, runs ctest, then merges profraw + generates the
            # coverage report) instead of TheRock's normal test runner.
            uv pip install pyyaml 2>/dev/null || python -m pip install --quiet pyyaml 2>/dev/null || true
            CFG="$(find "rocm-libraries/projects/${TEST_COMPONENT}" -name test_categories_coverage.yaml 2>/dev/null | head -1 || true)"
            # ctest dir is build/bin/<Component>; TheRock's dir casing may differ from
            # TEST_COMPONENT (e.g. hipRAND vs hiprand), so match case-insensitively.
            # The '|| true' keeps set -e/pipefail from killing the step when find/grep
            # produce no match.
            TDIR="$(find build/bin -maxdepth 1 -type d -iname "${TEST_COMPONENT}" 2>/dev/null | head -1 || true)"
            TDIR="${TDIR:-build/bin/${TEST_COMPONENT}}"
            echo "coverage_runner.py: config=${CFG} test-dir=${TDIR}"
            python rocm-libraries/.github/scripts/export_coverage_metadata.py \
              --build-dir ./build --project "${TEST_COMPONENT}" \
              --config "${CFG}" --output ./coverage_metadata.json
            python rocm-libraries/.github/scripts/coverage_runner.py \
              --build-dir ./build --metadata ./coverage_metadata.json \
              --coverage-dir "${GITHUB_WORKSPACE}/coverage-report" \
              --test-dir "${TDIR}" 2>&1 | tee ./test_logs/test_output.log
          else
            # Run test and capture output (still display to console)
            python ./build_tools/memory_monitor.py --phase "Test ${{ fromJSON(inputs.component).job_name }}" -- \
              bash -c '${{ fromJSON(inputs.component).test_script }}' 2>&1 | tee ./test_logs/test_output.log
          fi

      - name: Debug profraw generation post-test
        if: ${{ inputs.coverage_enabled && !cancelled() }}
        run: |
          set +e  # diagnostic only; never fail
          echo "================================================"
          echo "=== POST-TEST PROFRAW GENERATION CHECK START ==="
          echo "================================================"

          # 1. Search for any profraw files anywhere
          echo ""
          echo "--- [1] Profraw File Search (Entire Workspace) ---"
          echo "Searching ${GITHUB_WORKSPACE} for *.profraw..."
          PROFRAW_FILES="$(find "${GITHUB_WORKSPACE}" -name "*.profraw" 2>/dev/null)"
          if [[ -n "${PROFRAW_FILES}" ]]; then
            echo "✓ Found profraw files:"
            echo "${PROFRAW_FILES}" | while read -r f; do
              size="$(stat -c%s "$f" 2>/dev/null || echo "?")"
              echo "  $f (${size} bytes)"
            done
          else
            echo "✗ NO profraw files found anywhere in workspace"
          fi

          # 2. Check expected profraw directory
          echo ""
          echo "--- [2] Expected Profraw Directory ---"
          PROFRAW_DIR="${GITHUB_WORKSPACE}/coverage-report/profraw"
          echo "Expected location: ${PROFRAW_DIR}"
          if [[ -d "${PROFRAW_DIR}" ]]; then
            echo "Directory exists. Contents:"
            ls -lah "${PROFRAW_DIR}/" || echo "(empty or unreadable)"
            COUNT="$(find "${PROFRAW_DIR}" -name "*.profraw" 2>/dev/null | wc -l)"
            echo "Total .profraw files in expected dir: ${COUNT}"
          else
            echo "✗ Expected profraw directory does NOT exist"
          fi

          # 3. Check /tmp for profraw files (common fallback location)
          echo ""
          echo "--- [3] /tmp Profraw Check ---"
          echo "Checking /tmp for *.profraw..."
          find /tmp -name "*.profraw" 2>/dev/null | head -20 || echo "(no profraw files in /tmp)"

          # 4. Check build directory for profraw
          echo ""
          echo "--- [4] Build Directory Profraw Check ---"
          echo "Checking ./build for *.profraw..."
          find ./build -name "*.profraw" 2>/dev/null | head -20 || echo "(no profraw files in ./build)"

          # 5. Environment variable check (what was actually set during test)
          echo ""
          echo "--- [5] Environment Variable Final State ---"
          echo "LLVM_PROFILE_FILE=${LLVM_PROFILE_FILE}"
          echo "All PROFILE-related env vars:"
          env | grep -i profile || echo "(none set)"

          # 6. Check test output for profiling-related errors or warnings
          echo ""
          echo "--- [6] Test Output Grep for Profile Keywords ---"
          if [[ -f ./test_logs/test_output.log ]]; then
            echo "Searching test output for profile/coverage keywords..."
            grep -iE "profile|coverage|profraw|profdata|llvm_profile" ./test_logs/test_output.log | head -30 || echo "(no profile-related messages in test output)"
          else
            echo "(test output log not found)"
          fi

          # 7. Disk space and write test
          echo ""
          echo "--- [7] Disk Space and Write Test ---"
          echo "Disk space:"
          df -h "${GITHUB_WORKSPACE}" | head -2
          echo "Final write test to profraw dir:"
          TEST_FILE="${PROFRAW_DIR}/debug-write-test-$$.profraw"
          if echo "test data" > "${TEST_FILE}" 2>/dev/null; then
            echo "✓ Successfully wrote test file: ${TEST_FILE}"
            ls -lh "${TEST_FILE}"
            rm -f "${TEST_FILE}"
          else
            echo "✗ FAILED to write test file to ${PROFRAW_DIR}"
          fi

          # 8. Check if instrumented library was actually loaded
          echo ""
          echo "--- [8] Runtime Library Loading Verification ---"
          if [[ -f ./test_logs/test_output.log ]]; then
            echo "Checking if any library loading errors occurred..."
            grep -iE "error.*load|cannot open|not found.*\.so" ./test_logs/test_output.log | head -10 || echo "(no library loading errors found)"
          fi

          # 9. Process check - were there any profiling-related processes?
          echo ""
          echo "--- [9] Process Information ---"
          echo "Current user: $(whoami)"
          echo "Current working directory: $(pwd)"
          echo "Processes containing 'test' or 'hiprand' (should be none if tests finished):"
          ps aux | grep -iE "test|hiprand" | grep -v grep | head -10 || echo "(no relevant processes running)"

          echo ""
          echo "=============================================="
          echo "=== POST-TEST PROFRAW GENERATION CHECK END ==="
          echo "=============================================="

      - name: Merge profraw and generate coverage report
        # Superseded by coverage_runner.py in the Test step (reboss suggestion):
        # coverage_runner.py now runs the tests, merges profraw, and generates the
        # report. Kept here (disabled) for reference / quick revert.
        if: ${{ false }}
        shell: bash
        env:
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          PROJECT: ${{ fromJSON(inputs.component).job_name }}
          BUILD: ${{ github.workspace }}/build
          PROFRAW_DIR: ${{ github.workspace }}/coverage-report/profraw
          REPORT_DIR: ${{ github.workspace }}/coverage-report
          LLVM_BIN: ${{ github.workspace }}/build/lib/llvm/bin
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib/llvm/lib:${{ github.workspace }}/build/lib
        run: |
          set -euo pipefail
          # --- TEMP DEBUG: locate profraw files across the container ---
          echo "== profraw discovery =="
          echo "PROFRAW_DIR=${PROFRAW_DIR}"
          ls -la "${PROFRAW_DIR}" 2>/dev/null || echo "(coverage-profraw dir missing)"
          echo "-- find *.profraw under workspace, /tmp, HOME --"
          find "${GITHUB_WORKSPACE}" /tmp "${HOME}" -name '*.profraw' 2>/dev/null | head -50 || true
          _SO="${BUILD}/lib/lib${PROJECT}.so"
          echo "-- lib layout: ${BUILD}/lib/lib${PROJECT}.so* --"
          ls -la "${BUILD}/lib/lib${PROJECT}.so"* 2>/dev/null || echo "(no lib${PROJECT}.so* under ${BUILD}/lib)"
          _REAL="$(readlink -f "${_SO}" 2>/dev/null || true)"
          echo "readlink -f ${_SO} -> ${_REAL:-<dangling/unresolved>}"
          echo "-- instr check (direct symlink path) --"
          "${LLVM_BIN}/llvm-nm" "${_SO}" 2>/dev/null | grep -c "__llvm_profile" || echo "(nm failed / lib missing)"
          echo "-- instr check (readlink-resolved real file) --"
          if [ -n "${_REAL}" ] && [ -e "${_REAL}" ]; then
            echo "resolved __llvm_profile count: $("${LLVM_BIN}/llvm-nm" "${_REAL}" 2>/dev/null | grep -c "__llvm_profile" || true)"
          else
            echo "(resolved target missing)"
          fi
          echo "-- all lib${PROJECT}.so* under build (resolved symbol counts) --"
          find "${BUILD}" -name "lib${PROJECT}.so*" 2>/dev/null | while read -r f; do
            r="$(readlink -f "$f" 2>/dev/null || echo "$f")"
            echo "  $("${LLVM_BIN}/llvm-nm" "$r" 2>/dev/null | grep -c "__llvm_profile" || true) : $f -> $r"
          done || true
          echo "-- ldd of ${PROJECT} test binaries (which lib${PROJECT} is loaded) --"
          for tb in $(find "${BUILD}/bin" -type f -name "*${PROJECT}*" 2>/dev/null | head -3); do
            echo "  [$tb]"; ldd "$tb" 2>/dev/null | grep -i "${PROJECT}" || echo "    (no ${PROJECT} entry in ldd)"
          done
          echo "== end profraw discovery =="
          # --- END TEMP DEBUG ---
          mkdir -p "${REPORT_DIR}"
          OBJECT="${BUILD}/lib/lib${PROJECT}.so"
          PROFDATA="${REPORT_DIR}/${PROJECT}.profdata"

          IGNORE_RE=""
          CFG="$(find "${GITHUB_WORKSPACE}/rocm-libraries/projects/${PROJECT}" -name test_categories_coverage.yaml 2>/dev/null | head -1)"
          if [[ -n "${CFG}" ]]; then
            val="$(grep -m1 '^ignore_filename_regex:' "${CFG}" | cut -d: -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "${val}" in
              \'*\') val="${val#\'}"; val="${val%\'}" ;;
              \"*\") val="${val#\"}"; val="${val%\"}" ;;
            esac
            IGNORE_RE="${val}"
          fi
          IGNORE_ARGS=()
          if [[ -n "${IGNORE_RE}" ]]; then IGNORE_ARGS=("-ignore-filename-regex=${IGNORE_RE}"); fi

          PATHEQ="-path-equivalence=${GITHUB_WORKSPACE},${GITHUB_WORKSPACE}/rocm-libraries"

          "${LLVM_BIN}/llvm-profdata" merge -sparse -o "${PROFDATA}" ${PROFRAW_DIR}/*.profraw
          "${LLVM_BIN}/llvm-cov" report -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            | tee "${REPORT_DIR}/code_cov_${PROJECT}.report"
          "${LLVM_BIN}/llvm-cov" show -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            "${PATHEQ}" -Xdemangler="${LLVM_BIN}/llvm-cxxfilt" --format=html --output-dir="${REPORT_DIR}" || true
          "${LLVM_BIN}/llvm-cov" export -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            --format=lcov > "${REPORT_DIR}/coverage.info"

          sed -i "s|${GITHUB_WORKSPACE}/||g" "${REPORT_DIR}/coverage.info"

          {
            echo "### ${PROJECT} coverage (${AMDGPU_FAMILIES})"
            echo ""
            echo '```'
            tail -n 3 "${REPORT_DIR}/code_cov_${PROJECT}.report"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Notify Teams Channel on Failure
        if: ${{ failure() && !github.event.pull_request.head.repo.fork }}
        run: |
          python3 rocm-libraries/.github/scripts/notify_teams.py \
            --failure-stage test \
            --log-path ./test_logs/test_output.log \
            --webhook-urls '{"miopen":"${{ secrets.MIOPEN_CI_WEBHOOK_URL }}","hipdnn":"${{ secrets.HIPDNN_CI_WEBHOOK_URL }}"}' \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --component-name "${{ fromJSON(inputs.component).job_name }}" \
            --job-name "${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})"

      # GitHub's 'Complete job' step is unaware of launched executables
      # and will fail to clean up orphan processes.
      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\build_tools\github_actions\cleanup_processes.ps1'

      - name: Post-job cleanup GPU processes on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./build_tools/github_actions/cleanup_processes.sh
